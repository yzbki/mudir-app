spring.application.name=mudir
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mudir}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
# OAuth client ID that Google ID tokens must be issued for (the token's "aud" claim).
# Not a secret; must match VITE_GOOGLE_CLIENT_ID in the frontend.
google.client-id=${GOOGLE_CLIENT_ID:1099384573752-1gelns5uc5k2ds9sq522s7kad3lsvro7.apps.googleusercontent.com}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
